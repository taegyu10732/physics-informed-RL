[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-source-navigation"
version = "0.1.0"
description = "PI-U-Net gas reconstruction and reinforcement-learning source navigation"
readme = "README.md"
requires-python = ">=3.9,<3.12"
license = {file = "LICENSE"}
dependencies = [
  "gymnasium==0.29.1",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "stable-baselines3==2.3.2",
  "torch==2.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest==7.2.2",
  "ruff==0.12.8",
]

[project.scripts]
gsn-train-unet = "gas_source_navigation.cli.train_unet:main"
gsn-train-rl = "gas_source_navigation.cli.train_rl:main"
gsn-evaluate = "gas_source_navigation.cli.evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["gas_source_navigation*"]

[tool.setuptools.package-data]
gas_source_navigation = ["py.typed", "assets/maps/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  "error:invalid value encountered in double_scalars:RuntimeWarning",
  "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
  "ignore:The distutils package is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [".venv", "archive", "build", "dist"]
