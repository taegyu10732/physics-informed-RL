[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-source-navigation"
version = "0.1.0"
description = "Gas-field reconstruction and reinforcement-learning source navigation"
readme = "README.md"
requires-python = ">=3.9,<3.11"
license = {file = "LICENSE"}
dependencies = [
  "gymnasium==0.29.1",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "stable-baselines3==2.3.2",
  "torch==2.2.2",
]

[tool.setuptools.packages.find]
include = ["gas_predict*", "rlm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
